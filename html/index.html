<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sentinel Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="panel">
      <aside class="sidebar">
        <div class="brand" id="brand"></div>
        <nav class="tabs">
          <span class="nav-label">Management</span>
          <button class="tab-btn active" data-tab="players">Players</button>
          <button class="tab-btn" data-tab="items">Item Generator</button>
          <span class="nav-label">Protection</span>
          <button class="tab-btn" data-tab="logs">Detections</button>
          <button class="tab-btn" data-tab="bans">Bans</button>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span> Protection active
        </div>
      </aside>

      <div class="main">
      <header class="panel-header">
        <span class="page-title" id="pageTitle">Players</span>
        <button class="close-btn" data-action="close" title="Close (ESC)">&times;</button>
      </header>

      <div class="stats-bar" id="statsBar">
        <div class="stat"><span class="stat-value" data-stat="players">–</span><span class="stat-label">Online</span></div>
        <div class="stat"><span class="stat-value" data-stat="flags">–</span><span class="stat-label">Flags</span></div>
        <div class="stat"><span class="stat-value" data-stat="blockedEvents">–</span><span class="stat-label">Blocked events</span></div>
        <div class="stat"><span class="stat-value" data-stat="kicks">–</span><span class="stat-label">AC kicks</span></div>
        <div class="stat"><span class="stat-value" data-stat="bans">–</span><span class="stat-label">AC bans</span></div>
        <div class="stat"><span class="stat-value" data-stat="activeBans">–</span><span class="stat-label">Active bans</span></div>
      </div>

      <main class="panel-body">
        <section class="tab-page active" data-page="players">
          <div class="toolbar">
            <input type="search" id="playerSearch" placeholder="Search players..." />
            <button class="btn" data-action="refreshPlayers">Refresh</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Ping</th>
                  <th>Flags</th>
                  <th class="actions-col">Actions</th>
                </tr>
              </thead>
              <tbody id="playersBody"></tbody>
            </table>
          </div>
        </section>

        <section class="tab-page" data-page="items">
          <div class="itemgen">
            <div class="field">
              <label for="itemTarget">Target</label>
              <select id="itemTarget"></select>
            </div>
            <div class="field">
              <label for="itemSearch">Item</label>
              <input type="search" id="itemSearch" placeholder="Search items..." />
            </div>
            <div class="field">
              <label for="itemSelect">&nbsp;</label>
              <select id="itemSelect" size="8"></select>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="itemCount">Quantity</label>
                <input type="number" id="itemCount" value="1" min="1" />
              </div>
              <button class="btn primary" id="giveItemBtn">Give Item</button>
            </div>
          </div>
        </section>

        <section class="tab-page" data-page="logs">
          <div class="toolbar">
            <input type="search" id="logSearch" placeholder="Filter by player or detail..." />
            <select id="logKind"><option value="">All detections</option></select>
            <button class="btn" data-action="refreshLogs">Refresh</button>
          </div>
          <div class="log-list" id="logList"></div>
        </section>

        <section class="tab-page" data-page="bans">
          <div class="toolbar">
            <input type="search" id="banSearch" placeholder="Search by name, ban ID or reason..." />
            <button class="btn" data-action="refreshBans">Refresh</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Ban ID</th>
                  <th>Name</th>
                  <th>Reason</th>
                  <th>By</th>
                  <th>Expires</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="bansBody"></tbody>
            </table>
          </div>
        </section>
      </main>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="playerModal">
    <div class="modal">
      <header class="modal-header">
        <span id="modalTitle">Player</span>
        <button class="close-btn" data-action="closeModal" title="Close">&times;</button>
      </header>
      <div class="modal-body">
        <div class="info-grid" id="modalInfo"></div>
        <div class="toolbar">
          <button class="btn primary" id="screenshotBtn">Take screenshot</button>
        </div>
        <div class="screenshot-wrap" id="screenshotWrap"></div>
        <div class="troll-section" id="trollSection">
          <div class="section-head">
            <h4>Trolls</h4>
            <div class="troll-controls">
              <label for="trollDuration">Duration (s)</label>
              <input type="number" id="trollDuration" value="30" min="1" />
              <button class="btn small danger" id="trollStopBtn">Stop all</button>
            </div>
          </div>
          <div class="troll-active" id="trollActive"></div>
          <div class="troll-grid" id="trollGrid"></div>
        </div>
        <h4>Flags this session</h4>
        <div class="log-list" id="modalFlags"></div>
      </div>
    </div>
  </div>

  <script src="branding.js"></script>
  <script src="app.js"></script>
</body>
</html>
